services:
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:-}
      COSMOS_KEY: ${COSMOS_KEY:-}
      COSMOS_DATABASE: ${COSMOS_DATABASE:-campusbooking}
    ports:
      - "4001:4001"

  event-service:
    build: ./services/event-service
    environment:
      PORT: 4002
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:-}
      COSMOS_KEY: ${COSMOS_KEY:-}
      COSMOS_DATABASE: ${COSMOS_DATABASE:-campusbooking}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-event-images}
    ports:
      - "4002:4002"
    volumes:
      - event_uploads:/app/uploads

  booking-service:
    build: ./services/booking-service
    environment:
      PORT: 4003
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:-}
      COSMOS_KEY: ${COSMOS_KEY:-}
      COSMOS_DATABASE: ${COSMOS_DATABASE:-campusbooking}
      EVENT_SERVICE_URL: http://event-service:4002
      CONFIRMATION_FUNCTION_URL: ${CONFIRMATION_FUNCTION_URL:-}
    depends_on:
      - event-service
    ports:
      - "4003:4003"

  frontend:
    build: ./frontend
    depends_on:
      - auth-service
      - event-service
      - booking-service
    ports:
      - "8080:80"

volumes:
  event_uploads:
